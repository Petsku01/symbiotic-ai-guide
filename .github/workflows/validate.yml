name: Validate Docs and Scripts

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax checks (scripts + tools)
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts tools -type f -name '*.sh' -print0)

      - name: JS syntax checks (tools/uncertainty)
        run: |
          if [ -d tools/uncertainty ]; then
            while IFS= read -r -d '' file; do
              node --check "$file"
            done < <(find tools/uncertainty -type f -name '*.js' -print0)
          fi

      - name: Run documentation safety validation
        run: |
          chmod +x scripts/validate-docs-safety.sh
          ./scripts/validate-docs-safety.sh

      - name: Run onboarding command smoke test (non-destructive)
        run: |
          chmod +x scripts/smoke-test-onboarding-commands.sh
          ./scripts/smoke-test-onboarding-commands.sh

      - name: Markdown relative link check
        run: |
          chmod +x scripts/check-markdown-links.sh
          ./scripts/check-markdown-links.sh

      - name: ShellCheck (if available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            # Keep CI strict on true shell errors while avoiding noise from style/info-only findings.
            # -x follows sourced files; -S error fails only on error severity.
            find scripts tools -type f -name '*.sh' -print0 | xargs -0 shellcheck -x -S error
          else
            echo "shellcheck not available on runner; skipping"
          fi

      - name: Secret scan (gitleaks or fallback)
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --no-banner --verbose
          else
            echo "gitleaks not available; running lightweight fallback scan"
            ! grep -RInE --exclude-dir=.git \
              '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9_]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z\-_]{35}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' .
          fi
